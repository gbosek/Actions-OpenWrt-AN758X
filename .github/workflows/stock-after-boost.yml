name: XG2010G stock after boost
run-name: XG2010G MWAN4 stock 500–1200MHz (after four boost builds)
on:
  push:
    branches: [xg2010g-mwan4-stock-after-boost]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: xg2010g-stock-after-boost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wait:
    name: Wait for all four boost firmware builds
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: Check wait recovery
        run: python3 CPU/tests/queue-recovery-test.py
      - name: Cancel superseded waiting queues
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'stock-after-boost.yml', branch, per_page: 100
            });
            for (const run of runs) {
              if (run.id >= context.runId || !['queued', 'in_progress'].includes(run.status)) continue;
              const result = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: run.id});
              const waiting = result.data.jobs.some(j => j.name === 'Wait for all four boost firmware builds' && ['queued', 'in_progress'].includes(j.status));
              if (waiting) {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info(`Superseded waiting queue cancelled: ${run.id}`);
              }
            }
      - name: Wait for successful latest boost branch runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/wait-for-boost.py --manifest STOCK-BUILD-DEPS.json
  stock:
    name: Stock ${{ matrix.NPU }}
    needs: wait
    strategy:
      fail-fast: false
      matrix:
        NPU: [naoki, luanmuc]
    uses: ./.github/workflows/build-ponwrt.yml
    with:
      npu: ${{ matrix.NPU }}
