name: Build PonWrt (Airoha AN758x PON)
run-name: XG2010G 6.18.55 + DNS routing and LAN LED fixes - naoki and luanmuc

# =========================================================
# 固件版本后缀（显示在 LuCI 概览页「固件版本」后面）
#   FW_AUTHOR 是唯一真相源，改动请只改 env.FW_AUTHOR 这一处。
# =========================================================
env:
  BUILD_ROOT: /workdir
  SOURCE: ${{ github.event.inputs.source || 'pbs05/ponwrt' }}
  # 唯一真相源：固件版本后缀的作者名（LuCI 概览页「固件版本」）
  FW_AUTHOR: 'qwe'
  REPO_URL: ${{ (github.event.inputs.source || 'pbs05/ponwrt') == 'pbs05/ponwrt' && 'https://github.com/pbs05/ponwrt' || 'https://github.com/qwe3017/ponwrt' }}
  FEEDS_CONF: ''
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: ${{ github.event.inputs.upload_release || 'true' }}
  USE_DL_CACHE: true
  USE_CCACHE: false
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  SOC: ${{ github.event.inputs.soc || 'an7581' }}
  PROFILE: ${{ github.event.inputs.profile || 'gemtek_xg2010g' }}
  BUILD_SCOPE: ${{ github.event.inputs.scope || 'firmware' }}
  IGNORE_CACHE: ${{ github.event.inputs.ignore_cache || 'false' }}
  FW_BUILD_TIME: ''                 # 留空 = 自动取构建时时间（Asia/Shanghai）
  FW_DESC_SUFFIX: ''               # 留空 = "· qwe · <构建时间>"；填了则完全自定义

on:
  push:
    branches: [work/xg2010g-1456-ppe-20261014, work/xg2010g-boot-log-fixes-20261018]
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source:
        description: '编译源码仓库'
        required: true
        default: 'pbs05/ponwrt'
        type: choice
        options:
          - fork
          - pbs05/ponwrt
      branch:
        description: 'ponwrt 源码分支'
        required: true
        default: 'master'
      soc:
        description: 'SoC 平台'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583
      profile:
        description: '机型 profile (all=全机型编译)'
        required: true
        default: 'gemtek_xg2010g'
        type: choice
        options:
          - fiberhome_hg5585f-cu
          - fiberhome_hg5585f-ct
          - fiberhome_hg5382a
          - gemtek_xg2010g
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-tf-ubi
          - unionman_ung00a
          - znxt_zn504xg-d
          - znxt_zn515xg-d
          - h3c_hm2004-du
          - nokia_xg-040g-mf
          - nokia_xg-040g-mf-ubi
          - all
      scope:
        description: '构建范围 (toolchain-only 仅预热工具链缓存)'
        required: true
        default: 'firmware'
        type: choice
        options:
          - firmware
          - toolchain-only
      ignore_cache:
        description: '忽略工具链缓存强制重编'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      # 覆盖口：不填即为 env.FW_AUTHOR 的 "qwe"。保留输入项仅为临时指定其他作者。
      fw_author:
        description: '覆盖固件版本后缀的作者名（LuCI 概览页「固件版本」）。留空 = qwe'
        required: false
        default: 'qwe'
      upload_release:
        description: '固件发布到 Release（false 则只传 Artifact）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      ssh:
        description: 'SSH connection to Actions (仅 main 分支、仓库所有者可触发)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 最小权限：发布阶段需要 contents: write；清理阶段需要 actions: read/write
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: XG2010G 1456 PPE + PON full-width - ${{ matrix.npu }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        npu: [naoki, luanmuc]
    env:
      NPU_VARIANT: ${{ matrix.npu }}
    # 350 分钟接近 GitHub-hosted 6 小时上限；首次冷构建（工具链+全量 kmod）
    # 在 4 核 16G runner 上可能超时，建议拆出 toolchain-only 预热 job。
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # =========================================================
      # 0. 解析机型 -> 自动校正 SoC，导出 device name
      # =========================================================
      - name: Resolve device profile
        id: resolve
        run: |
          PROFILE="${PROFILE}"
          SOC="${SOC}"

          # 缓存版本号：按「年+周」滚动（如 202639）。
          # 用途：dl / ccache 的 key 用它替代 run_id、run_number。
          # 若用 run_* ，每次运行都会 save 一份新副本，10GB 配额很快被
          # 刷满并淘汰掉真正有用的旧缓存；改用周号后同一周内复用同一条目。
          echo "week=$(date +%Y%W)" >> "$GITHUB_OUTPUT"

          if [ "$PROFILE" != "all" ]; then
            case "$PROFILE" in
              nokia_xg-040g-mf*) SOC="an7583" ;;
              *)                  SOC="an7581" ;;
            esac
          fi

          # 若传入的 soc 与机型冲突，以机型为准
          echo "SOC=$SOC" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "DEVICE_NAME=ponwrt-${SOC}-${PROFILE}" >> "$GITHUB_ENV"
          # 每机型一份 config；profile=all 时回退到 SoC 通用配置
          if [ "$PROFILE" = "all" ]; then
            echo "CONFIG_FILE=configs/${SOC}.config" >> "$GITHUB_ENV"
          else
            echo "CONFIG_FILE=configs/${PROFILE}.config" >> "$GITHUB_ENV"
          fi

          echo "========================================"
          echo "SoC      : $SOC"
          echo "Profile  : $PROFILE"
          echo "Source   : ${SOURCE} (${REPO_URL})"
          echo "Branch   : ${REPO_BRANCH}"
          echo "Scope    : ${BUILD_SCOPE}"
          echo "Author   : ${FW_AUTHOR}"
          echo "========================================"

      # =========================================================
      # 1. 释放空间 + 初始化编译环境
      # =========================================================
      - name: Check compatibility boost and NPU adapters
        run: |
          python3 CPU/tests/run.py
          python3 Packages/xg2010g-rps/tests/rps-test.py
          python3 CPU/tests/network-defaults-test.py
          python3 CPU/tests/pon-selection-test.py
          python3 tests/ppe-prepare-test.py
          python3 UI/tests/pon-install-test.py
          python3 CPU/tests/driver-fixes-test.py
          node UI/tests/overview-test.js
          python3 Runtime/tests/runtime-test.py
          python3 Runtime/tests/route-test.py
          node Runtime/tests/export-test.js

      - name: Cancel superseded boost builds
        if: endsWith(github.ref_name, '-boost') || github.ref_name == 'work/xg2010g-1456-ppe-20261014'
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'build-ponwrt.yml', branch, per_page: 100
            });
            for (const run of runs) {
              if (run.id >= context.runId || run.head_sha === context.sha || !['queued', 'in_progress'].includes(run.status)) continue;
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
              core.info(`Superseded boost build cancelled: ${run.id}`);
            }

      - name: Free disk space & init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # --- 删除预装大件 ---
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -yqq purge firefox snapd 2>/dev/null || true

          # --- 配置 8G Swap (aarch64 工具链/内核编译需要) ---
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

          # --- 安装编译依赖 ---
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang llvm dwarves \
            libssl-dev libelf-dev bc flex bison python3 python3-distutils \
            xz-utils tar unzip zip zstd dos2unix ccache gettext \
            rsync file wget curl git subversion 2>/dev/null || true

          # 初始化编译环境：建议将该脚本入仓并按 commit sha 校验，
          # 避免 `curl | bash` 的供应链风险。
          if [ -x "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" ]; then
            bash "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" || true
          else
            sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)' || true
          fi

          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq clean
          sudo -E timedatectl set-timezone "$TZ"

          # --- 编译根目录（固定 /workdir，与 workflow 级 env 保持一致）---
          # 注意：BUILD_ROOT 必须是 workflow 级静态变量，不能用 GITHUB_ENV 动态写入，
          # 否则 actions/cache 的 with.path 里 ${{ env.BUILD_ROOT }} 会解析成空串，
          # dl 缓存命中不到 /openwrt/dl，导致工具链编译时源码包缺失。
          sudo mkdir -p /workdir
          sudo chown "$USER":"$USER" /workdir

          echo "磁盘空间:"; df -hT
          echo "内存/Swap:"; free -h

      # =========================================================
      # 2. 克隆源码
      # =========================================================
      - name: Clone source code
        run: |
          cd "$BUILD_ROOT"
          df -hT "$PWD"
          git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
          if [ "$SOURCE" = 'pbs05/ponwrt' ] && [ "$REPO_BRANCH" = 'master' ]; then
            git -C openwrt fetch --depth=1 origin a57faf93c6c3638ba3651690228aabaa51d3f235
            git -C openwrt checkout --detach a57faf93c6c3638ba3651690228aabaa51d3f235
          fi
          ln -sf "$BUILD_ROOT/openwrt" "$GITHUB_WORKSPACE/openwrt"

          # 输入项为空时回退到 workflow 级默认值，确保 diy-part2.sh 拿到的
          # 始终是确定值，而不是空串（空串会让 LuCI 概览页显示 "·  ·"）。
          echo "FW_AUTHOR=${FW_AUTHOR:-qwe}" >> "$GITHUB_ENV"

          cd openwrt && echo "commit: $(git rev-parse --short HEAD)"

      # =========================================================
      # 3. dl 下载缓存
      # =========================================================
      - name: Cache dl directory
        if: env.USE_DL_CACHE == 'true'
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: /workdir/openwrt/dl
          # 按分支 + 周号：同一周内复用同一条目。
          # 原先用 github.run_number → 每次运行都 save 一份新副本，
          # 10GB 配额会被迅速刷满并淘汰掉有用的旧缓存。
          key: ponwrt-dl-${{ env.SOURCE }}-${{ github.event.inputs.branch || 'master' }}-${{ steps.resolve.outputs.week }}
          restore-keys: |
            ponwrt-dl-${{ env.SOURCE }}-${{ github.event.inputs.branch || 'master' }}-
          # 关键：即使后面编译失败也要保住已下载的源码包
          save-always: true

      # =========================================================
      # 4. 更新并安装 Feeds
      # =========================================================
      - name: Update & install feeds
        run: |
          cd "$BUILD_ROOT/openwrt"
          if [ -n "${FEEDS_CONF}" ] && [ -e "$GITHUB_WORKSPACE/${FEEDS_CONF}" ]; then
            cp "$GITHUB_WORKSPACE/${FEEDS_CONF}" feeds.conf.default
          fi
          python3 "$GITHUB_WORKSPACE/scripts/select-pon.py" . --variant "$NPU_VARIANT" --phase feed
          python3 "$GITHUB_WORKSPACE/scripts/pin-offload-baseline.py" .
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # =========================================================
      # 5. diy-part1.sh —— 拉取可选插件
      # =========================================================
      - name: Pull optional plugins (diy-part1.sh)
        run: |
          cd "$BUILD_ROOT/openwrt"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"


      # =========================================================
      # 6. 加载 .config —— 源码基座 defconfig 打底 + 机型精简配置追加
      # =========================================================
      - name: Load custom configuration
        run: |
          cd "$BUILD_ROOT/openwrt"
          # Copy contents, including when provenance has already created files/etc.
          # Copying the directory itself would install /files/sbin/tempinfo.
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p files
            cp -a "$GITHUB_WORKSPACE/files/." files/
          fi

          # git 可能在 checkout 时丢掉 exec bit，rpcd 就执行不了 tempinfo
          [ -d files/sbin ] && chmod +x files/sbin/* 2>/dev/null
          [ -d files/etc/uci-defaults ] && chmod +x files/etc/uci-defaults/* 2>/dev/null

          # =========================================================
          # 关键：先用源码自带的 configs/<soc>.config 基座打底
          # 精简配置只写差异，很多符号（如 LUCI_LANG_zh_Hans、TAR_*、
          # MAC80211_*）是 tristate 且无 default，默认 n。若直接拿精简
          # 配置当 .config，defconfig 会把它们重置成 n，导致中文包丢失。
          # 先铺基座再追加差异，基座所有非默认值都保留，后写的覆盖先写的。
          # =========================================================
          if [ -f "configs/${SOC}.config" ]; then
            cp "configs/${SOC}.config" .config
            echo "✅ 已用源码基座 defconfig 打底: configs/${SOC}.config"
          else
            : > .config
            echo "::warning::源码中无 configs/${SOC}.config，仅用精简配置"
          fi

          # 再追加工型精简配置（其中的 =y / is not set 会覆盖基座）
          if [ -e "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            cat "$GITHUB_WORKSPACE/${CONFIG_FILE}" >> .config
            echo "✅ 已追加机型配置: ${CONFIG_FILE}"
          elif [ -e "$GITHUB_WORKSPACE/configs/${SOC}.config" ]; then
            cat "$GITHUB_WORKSPACE/configs/${SOC}.config" >> .config
            echo "✅ 已追加 SoC 通用配置"
          else
            echo "::error::找不到机型配置 ${CONFIG_FILE}"
            exit 1
          fi

      # =========================================================
      # 7. 按机型裁剪: 只保留一个 TARGET_DEVICE
      # =========================================================
      - name: Apply device profile
        run: |
          cd "$BUILD_ROOT/openwrt"

          if [ "${PROFILE}" = "all" ]; then
            echo "全机型编译，不做裁剪"
          else
            # 清掉所有设备选中项（含 is not set 行），再单独打开目标机型
            sed -i '/CONFIG_TARGET_DEVICE_/d; /^CONFIG_TARGET_MULTI_PROFILE=/d' .config
            {
              echo "CONFIG_TARGET_MULTI_PROFILE=y"
              echo "CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y"
              echo "CONFIG_TARGET_DEVICE_PACKAGES_airoha_${SOC}_DEVICE_${PROFILE}=\"\""
            } >> .config
            echo "已裁剪为: CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y"
          fi

      # =========================================================
      # 8. diy-part2.sh —— 时区改为中国、写入固件版本后缀
      # =========================================================
      - name: Set timezone to China (diy-part2.sh)
        run: |
          cd "$BUILD_ROOT/openwrt"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          FW_AUTHOR="$FW_AUTHOR" FW_BUILD_TIME="$FW_BUILD_TIME" FW_DESC_SUFFIX="$FW_DESC_SUFFIX" \
          WIFI_5G_COUNTRY="$WIFI_5G_COUNTRY" WIFI_5G_CHANNEL="$WIFI_5G_CHANNEL" \
          WIFI_5G_HTMODE="$WIFI_5G_HTMODE" WIFI_5G_FALLBACK="$WIFI_5G_FALLBACK" \
            "$GITHUB_WORKSPACE/$DIY_P2_SH"

      # =========================================================
      # 9. defconfig + 生成工具链缓存 Key + 校验机型
      #     【唯一一次 defconfig】后续步骤不再调用，避免 .config 被重新展开、
      #     机型配置里显式写死的选择被静默剔除
      # =========================================================
      - name: Generate toolchain cache key
        id: cache-key
        run: |
          cd "$BUILD_ROOT/openwrt"

          # diffconfig(精简配置) 必须 defconfig 展开；保留末尾输出便于排查
          python3 "$GITHUB_WORKSPACE/scripts/select-pon.py" . --variant "$NPU_VARIANT" --phase config
          python3 "$GITHUB_WORKSPACE/scripts/select-pon.py" . --variant "$NPU_VARIANT" --phase verify
          echo "===== make defconfig ====="
          make defconfig 2>&1 | tail -5
          if [ "$PROFILE" = gemtek_xg2010g ]; then python3 "$GITHUB_WORKSPACE/scripts/check-runtime-config.py" .; fi
          python3 "$GITHUB_WORKSPACE/scripts/check-pon-build.py" . --variant "$NPU_VARIANT" --config-only

          # =========================================================
          # 关键包校验：defconfig 会把 feeds 里不存在的包静默剔除，
          # 这里显式确认 PON 核心链路还在，否则编出来光口不通
          # =========================================================
          MISSING=""
          PON_PACKAGES="luci-app-pon"
          [ "$NPU_VARIANT" = naoki ] && PON_PACKAGES="luci-app-onu luci-i18n-onu-zh-cn airoha-pon-debug"
          for p in kmod-airoha-xpon kmod-airoha-pon-frontend airoha-pond airoha-ponctl $PON_PACKAGES; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::以下关键包在 defconfig 后未启用，检查 feeds 是否完整:$MISSING"
            exit 1
          fi
          echo "✅ PON 关键包校验通过"

          # =========================================================
          # 状态插件校验：第三方包若在 package/custom 里缺失，
          # defconfig 会把 .config 里的 =y 当无效符号静默删除，
          # 编完发现界面里没这个菜单时才察觉就晚了
          # =========================================================
          OPT_MISS=""
          for p in luci-app-airoha-npu luci-app-pon-status luci-app-natmode; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              OPT_MISS="$OPT_MISS $p"
              echo "::warning::${p} 在 defconfig 后未启用"
              echo "  --- 诊断 ---"
              echo "  1) 包目录: $([ -d "package/custom/${p}" ] && echo '存在' || echo '不存在')"
              echo "  2) feeds 链接: $([ -e "package/feeds/custom/${p}" ] && echo '存在' || echo '不存在')"
              echo "  3) .packageinfo 记录: $(grep -c "Package: ${p}\$" tmp/.packageinfo 2>/dev/null || echo 0)"
              echo "  4) feeds.conf 中 custom: $(grep -cE '^src-link[[:space:]]+custom' feeds.conf.default 2>/dev/null || echo 0)"
              # 直接查询 buildroot 是否认识这个包
              echo "  5) 包符号探测:"
              grep -A3 "^Package: ${p}\$" tmp/.packageinfo 2>/dev/null | head -6 || echo "     (无记录)"
            fi
          done
          if [ -n "$OPT_MISS" ]; then
            echo "::error::状态插件缺失:$OPT_MISS 请检查 diy-part1.sh 的 clone / 拷贝是否成功"
            exit 1
          fi
          echo "✅ 状态插件校验通过"

          # XG2010G 的 MWAN4 与截图中的系统菜单项必须进入最终固件。
          if [ "${PROFILE}" = "gemtek_xg2010g" ]; then
            MENU_MISS=""
            for p in mwan4 luci-app-mwan4 luci-i18n-mwan4-zh-cn xg2010g-rps luci-i18n-airoha-npu-zh-cn \
                     luci-app-aurora-config luci-theme-aurora \
                     luci-app-autoreboot luci-app-mini-diskmanager luci-app-partexp \
                     luci-app-wol luci-i18n-wol-zh-cn etherwake flock \
                     luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn \
                     block-mount ttyd luci-app-ttyd; do
              if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
                MENU_MISS="$MENU_MISS $p"
              fi
            done
            if [ -n "$MENU_MISS" ]; then
              echo "::error::XG2010G 的 MWAN4/系统菜单插件未进入固件:$MENU_MISS"
              exit 1
            fi
            echo "✅ XG2010G MWAN4 与系统菜单包校验通过"
          fi

          # 中文包（po 注入后才存在，缺失只警告不阻断）
          if ! grep -q "^CONFIG_PACKAGE_luci-i18n-airoha-npu-zh-cn=y" .config; then
            echo "::warning::luci-i18n-airoha-npu-zh-cn 未启用（po/zh_Hans 未注入？界面将为英文）"
          fi

          # 机型校验: 机型名写错时直接失败，避免静默全编译
          if [ "${PROFILE}" != "all" ]; then
            if ! grep -q "^CONFIG_TARGET_DEVICE_airoha_${SOC}_DEVICE_${PROFILE}=y" .config; then
              echo "::error::机型 ${PROFILE} 在 ${SOC} 下不存在，请检查 profile 名称"
              exit 1
            fi
            echo "机型校验通过: ${PROFILE}"
          fi

          TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
          SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)

          TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
            -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)

          CACHE_KEY="ponwrt-toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}"
          CACHE_PREFIX="ponwrt-toolchain-${TARGET}-${SUBTARGET}"

          echo "CACHE_KEY=$CACHE_KEY"     >> "$GITHUB_OUTPUT"
          echo "CACHE_PREFIX=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "缓存 Key  : $CACHE_KEY"
          echo "缓存前缀  : $CACHE_PREFIX"
          echo "========================================"

      # =========================================================
      # 9.5 下载工具链源码 —— 必须在编工具链之前
      #     报错 "Can't open dl/musl-1.2.6.tar.gz" 就是这一步缺失导致的：
      #     make toolchain/install 不会自动补下载，只会去解压 dl 里已有的包
      # =========================================================
      - name: Download toolchain sources
        run: |
          cd "$BUILD_ROOT/openwrt"

          for i in 1 2 3; do
            echo "===== 第 $i 次尝试: tools/toolchain download ====="
            if make tools/download toolchain/download -j8; then
              echo "✅ 下载完成"
              break
            fi
            echo "::warning::第 $i 次下载失败，5 秒后重试"
            sleep 5
          done

          # 清理下载失败残留的小文件，否则解压时报 "does not look like a tar archive"
          echo "--- 清理损坏的下载包 ---"
          find dl -size -1024c -type f -exec ls -l {} \; 2>/dev/null
          find dl -size -1024c -type f -exec rm -f {} \; 2>/dev/null

          echo "dl 目录共 $(ls -1 dl 2>/dev/null | wc -l) 个文件"
          ls -lh dl 2>/dev/null | head -20

          # 工具链三大件强校验，缺了直接失败，别等到解压时才报
          MISS=""
          for pat in "musl-*.tar.gz" "gcc-*" "binutils-*"; do
            if ! ls dl/$pat >/dev/null 2>&1; then
              MISS="$MISS $pat"
            fi
          done
          if [ -n "$MISS" ]; then
            echo "::error::工具链源码缺失:$MISS 请检查网络或 dl 缓存"
            exit 1
          fi
          echo "✅ 工具链源码校验通过"

      # =========================================================
      # 10. 恢复工具链 —— 第一优先 actions/cache
      # =========================================================
      - name: Restore toolchain from actions/cache
        if: env.IGNORE_CACHE != 'true'
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: |
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/host*
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/tool*
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}

      # =========================================================
      # 11. 恢复工具链 —— 第二优先 Release 备份
      # =========================================================
      - name: Restore toolchain from Release backup
        if: env.IGNORE_CACHE != 'true' && steps.cache-restore.outputs.cache-hit != 'true'
        id: release-restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$BUILD_ROOT/openwrt"

          CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
          ASSET_NAME="${CACHE_KEY}.tzst"

          if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "toolchain-cache Release 不存在，首次运行"
            exit 0
          fi

          # tzst 需要 unzstd；runner 未预装时先装，避免「假命中」后解压失败
          which unzstd >/dev/null 2>&1 || sudo -E apt-get -yqq install zstd >/dev/null 2>&1 || true

          if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET_NAME"; then
            echo "从 Release 下载工具链: $ASSET_NAME"
            gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET_NAME" -D .
            tar -I unzstd -xf "$ASSET_NAME" || tar -xf "$ASSET_NAME"
            rm -f "$ASSET_NAME"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release 中无匹配缓存"
          fi

      # =========================================================
      # 12. 处理工具链
      # =========================================================
      - name: Handle toolchain
        id: toolchain
        run: |
          cd "$BUILD_ROOT/openwrt"

          CACHE_HIT="${{ steps.cache-restore.outputs.cache-hit }}"
          RELEASE_HIT="${{ steps.release-restore.outputs.restored }}"
          [ "$IGNORE_CACHE" = "true" ] && CACHE_HIT="" && RELEASE_HIT=""

          if [ "$CACHE_HIT" = "true" ]; then
            echo "actions/cache 命中，跳过工具链编译"
            echo "need_build=false"       >> "$GITHUB_OUTPUT"
            echo "need_save_cache=false"  >> "$GITHUB_OUTPUT"
            echo "need_save_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_HIT" = "true" ]; then
            echo "Release 缓存命中，回写 actions/cache"
            echo "need_build=false"       >> "$GITHUB_OUTPUT"
            echo "need_save_cache=true"   >> "$GITHUB_OUTPUT"
            echo "need_save_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "无可用缓存，开始编译工具链..."
            make tools/install -j"$(nproc)" || make tools/install -j1 V=s || { echo "tools 编译失败"; exit 1; }
            make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s || { echo "toolchain 编译失败"; exit 1; }
            echo "need_build=true"        >> "$GITHUB_OUTPUT"
            echo "need_save_cache=true"   >> "$GITHUB_OUTPUT"
            echo "need_save_release=true" >> "$GITHUB_OUTPUT"
          fi

          # 后续 make 跳过工具链重编：touch 对应 stamp 而非 sed 改写 Makefile，
          # 避免上游调整缩进/换行后失效、并避免污染工作区。
          touch toolchain/stamp-compile tools/stamp-compile 2>/dev/null || true

      # =========================================================
      # 12.5 ccache 补装（仅 USE_CCACHE=true 时执行）
      #
      #   ccache 二进制由 tools/ccache 安装到 staging_dir/host/bin。
      #   tools/Makefile：
      #     ifneq ($(CONFIG_CCACHE)$(CONFIG_SDK),)
      #       tools-y += ccache xxhash
      #   即只有 CONFIG_CCACHE 生效时才会编入。
      #
      #   问题场景：工具链缓存命中 → 上面跳过 make tools/install →
      #   ccache 不在缓存里（缓存是未开 ccache 时建的）→
      #   rules.mk 的 TARGET_CC:= ccache $(TARGET_CC) 找不到二进制：
      #     /bin/sh: 1: .../staging_dir/host/bin/ccache: not found (Error 127)
      #
      #   故这里单独补装 tools/ccache，并在失败时自动关闭 ccache 继续编译，
      #   绝不因 ccache 让整次构建失败。
      # =========================================================
      - name: Setup ccache (opt-in)
        if: env.USE_CCACHE == 'true'
        run: |
          cd "$BUILD_ROOT/openwrt"

          # 1) 确保 .config 里有 CONFIG_CCACHE=y（rules.mk 据此启用 ccache）
          sed -i '/^CONFIG_CCACHE=/d; /^# CONFIG_CCACHE is not set/d' .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig >/dev/null 2>&1 || true

          # 2) 缺二进制就补装（ccache 依赖 xxhash → cmake，首次会多花几分钟）
          if [ ! -x staging_dir/host/bin/ccache ]; then
            echo "ccache 缺失，补装 tools/ccache ..."
            if ! make tools/ccache/install -j"$(nproc)"; then
              echo "::warning::tools/ccache 安装失败，自动关闭 ccache 继续编译"
              sed -i 's/^CONFIG_CCACHE=y/# CONFIG_CCACHE is not set/' .config
            fi
          fi

          # 3) 最终确认：仍然不可用就彻底关掉，避免 Error 127
          if ! grep -q '^CONFIG_CCACHE=y' .config; then
            echo "ccache: 已关闭"
          elif [ -x staging_dir/host/bin/ccache ]; then
            echo "ccache: 已启用 ($(staging_dir/host/bin/ccache --version | head -1))"
          else
            echo "::warning::ccache 二进制仍缺失，强制关闭"
            sed -i 's/^CONFIG_CCACHE=y/# CONFIG_CCACHE is not set/' .config
          fi

      # =========================================================
      # 13. 保存工具链到 actions/cache
      # =========================================================
      - name: Save toolchain to actions/cache
        uses: actions/cache/save@v5
        if: steps.toolchain.outputs.need_save_cache == 'true'
        # 即使固件编译失败也要保住工具链，避免下次冷启动
        continue-on-error: true
        with:
          path: |
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/host*
            ${{ env.BUILD_ROOT }}/openwrt/staging_dir/tool*
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}

      # =========================================================
      # 14. 保存工具链到 Release 备份
      # =========================================================
      - name: Save toolchain to Release backup
        if: steps.toolchain.outputs.need_save_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$BUILD_ROOT/openwrt"

          CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
          CACHE_PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"

          tar -I zstdmt -cf "${CACHE_KEY}.tzst" staging_dir/host* staging_dir/tool*
          ls -lh "${CACHE_KEY}.tzst"

          gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" \
              --title "Toolchain Cache" --notes "自动生成的工具链缓存，请勿手动删除" --latest=false

          # 删除同平台旧缓存
          gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' 2>/dev/null | grep "^${CACHE_PREFIX}" | while read -r old; do
              gh release delete-asset toolchain-cache "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            done

          gh release upload toolchain-cache "${CACHE_KEY}.tzst" --repo "$GITHUB_REPOSITORY" --clobber
          rm -f "${CACHE_KEY}.tzst"

      # =========================================================
      # 15. ccache 缓存
      # =========================================================
      - name: Cache ccache
        if: env.USE_CCACHE == 'true' && env.BUILD_SCOPE != 'toolchain-only'
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ env.BUILD_ROOT }}/openwrt/.ccache
          key: ponwrt-ccache-${{ env.SOC }}-${{ steps.resolve.outputs.week }}
          restore-keys: |
            ponwrt-ccache-${{ env.SOC }}-

      # =========================================================
      # 16. SSH 调试（仅受控场景开启）
      # =========================================================
      - name: SSH connection to Actions
        uses: mxschmitt/action-tmate@v3
        if: >-
          (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false')
          && github.ref == 'refs/heads/main'
          && github.actor == github.repository_owner
          && contains(github.event.action, 'ssh')

      # =========================================================
      # 17. 下载软件包（defconfig 已在步骤 9 执行，此处不再重复）
      # =========================================================
      - name: Download packages
        id: package
        if: env.BUILD_SCOPE != 'toolchain-only'
        run: |
          cd "$BUILD_ROOT/openwrt"
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试: make download ====="
            if make download -j8; then break; fi
            sleep 5
          done
          # 清理下载失败残留的小文件
          find dl -size -1024c -type f -exec ls -l {} \; 2>/dev/null
          find dl -size -1024c -type f -exec rm -f {} \; 2>/dev/null
          echo "dl 目录共 $(ls -1 dl 2>/dev/null | wc -l) 个文件"

      - name: Prepare and verify PPE candidate functions
        if: env.BUILD_SCOPE != 'toolchain-only'
        run: |
          cd "$BUILD_ROOT/openwrt"
          make target/linux/prepare -j2 V=s
          python3 "$GITHUB_WORKSPACE/scripts/check_ppe_functions.py" --build-dir build_dir
          python3 "$GITHUB_WORKSPACE/scripts/check-driver-fixes.py" --build-dir build_dir
          python3 "$GITHUB_WORKSPACE/scripts/check-upstream-backports.py" --build-dir build_dir
          python3 "$GITHUB_WORKSPACE/Offload/tests/check-prepared.py" --build-dir build_dir

      # =========================================================
      # 18. 编译固件
      #     并发数按可用内存动态计算：每个 cc1 约 1.5-2G RSS，
      #     4 核 16G runner 上 -j8 易触发 OOM-killer 杀 cc1。
      # =========================================================
      - name: Compile the firmware
        id: compile
        if: env.BUILD_SCOPE != 'toolchain-only'
        run: |
          cd "$BUILD_ROOT/openwrt"
          # 可用内存(MiB) / 2GiB 每 job，下限 1、上限 nproc
          JOBS=$(awk -v p="$(nproc)" '/^MemAvailable:/{m=int($2/2097152)+1} END{print m<p?m:p}' /proc/meminfo)
          JOBS=$(( JOBS < 1 ? 1 : JOBS ))
          echo "开始编译 (${JOBS} 线程) / 机型: ${PROFILE}"
          df -hT /

          if make -j"${JOBS}"; then
            echo "多线程编译成功"
          elif make -j1; then
            echo "单线程编译成功"
          elif make -j1 V=s; then
            echo "单线程详细日志编译成功"
          else
            echo "编译失败"
            exit 1
          fi

          df -hT /
          if [ "$PROFILE" = 'gemtek_xg2010g' ]; then
            python3 "$GITHUB_WORKSPACE/scripts/check-ppe-build.py" --manifest-dir bin/targets/airoha/an7581 --build-dir build_dir
            python3 "$GITHUB_WORKSPACE/scripts/check-xg2010g-build.py" .
            python3 "$GITHUB_WORKSPACE/scripts/check-pon-build.py" . --variant "$NPU_VARIANT"
            python3 "$GITHUB_WORKSPACE/scripts/check-compatible-boost.py" .
            python3 "$GITHUB_WORKSPACE/scripts/check-driver-fixes.py" --build-dir build_dir --compiled --report bin/targets/airoha/an7581/AN7581-DRIVER-FIXES-VERIFICATION.json
            python3 "$GITHUB_WORKSPACE/scripts/check-upstream-backports.py" --build-dir build_dir --report bin/targets/airoha/an7581/UPSTREAM-059895-VERIFICATION.json
            python3 "$GITHUB_WORKSPACE/Offload/tests/check-prepared.py" --build-dir build_dir --compiled --report bin/targets/airoha/an7581/NAOKI-OFFLOAD-VERIFICATION.json
            UCODE="$PWD/staging_dir/hostpkg/bin/ucode" python3 "$GITHUB_WORKSPACE/Runtime/tests/mwan4-default-off-test.py" .
            UCODE="$PWD/staging_dir/hostpkg/bin/ucode" python3 "$GITHUB_WORKSPACE/Runtime/tests/routing-functions-test.py" .
            python3 "$GITHUB_WORKSPACE/Runtime/tests/route-test.py"
            python3 "$GITHUB_WORKSPACE/CPU/tests/network-defaults-test.py"
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: Verify PON layout with firmware Aurora and Argon themes
        id: pon-layout
        if: steps.compile.outputs.status == 'success' && env.PROFILE == 'gemtek_xg2010g'
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/UI/tests" --ignore-scripts --no-audit --no-fund
          node "$GITHUB_WORKSPACE/UI/tests/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          PON_ROOT="$(python3 -c 'import os; from pathlib import Path; roots=list((Path(os.environ["BUILD_ROOT"])/"openwrt/build_dir").glob("target-*/root-airoha")); assert len(roots)==1, roots; print(roots[0])')"
          PON_TEST_ROOT="$PON_ROOT" \
          PON_TEST_SCREENSHOTS="$RUNNER_TEMP/pon-layout/screenshots" \
          PON_TEST_OUTPUT="$RUNNER_TEMP/pon-layout/results" \
            node "$GITHUB_WORKSPACE/UI/tests/node_modules/playwright/cli.js" test --config="$GITHUB_WORKSPACE/UI/tests/playwright.config.js"

      - name: Upload PON layout verification
        if: always() && (steps.pon-layout.outcome == 'success' || steps.pon-layout.outcome == 'failure')
        uses: actions/upload-artifact@v5
        with:
          name: PON-layout-${{ env.NPU_VARIANT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pon-layout
          retention-days: 14

      # =========================================================
      # 19. 空间检查
      # =========================================================
      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      # =========================================================
      # 20. 上传 bin 目录
      # =========================================================
      - name: Upload bin directory
        uses: actions/upload-artifact@v5
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.NPU_VARIANT }}${{ env.FILE_DATE }}
          # 必须用绝对路径：openwrt/bin 是 $GITHUB_WORKSPACE 下的符号链接
          # （Clone source code 步骤 ln -sf 建的），upload-artifact 遍历
          # 符号链接目录不可靠，可能传一个空包。
          path: ${{ env.BUILD_ROOT }}/openwrt/bin

      # =========================================================
      # 21. 整理并上传固件
      # =========================================================
      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          cd "$BUILD_ROOT"/openwrt/bin/targets/*/*
          cp "$BUILD_ROOT/openwrt/files/etc/airoha-build-source.json" AIROHA-SOURCE.json
          cp "$GITHUB_WORKSPACE/CPU-BOOST-SOURCE.json" CPU-BOOST-SOURCE.json
          cp "$GITHUB_WORKSPACE/MWAN4-SOURCE.json" MWAN4-SOURCE.json
          cp "$GITHUB_WORKSPACE/PPE-FIXES-SOURCE.json" PPE-FIXES-SOURCE.json
          cp "$GITHUB_WORKSPACE/UPSTREAM-059895-SOURCE.json" UPSTREAM-059895-SOURCE.json
          cp "$GITHUB_WORKSPACE/UPSTREAM-059895-VALIDATION.json" UPSTREAM-059895-VALIDATION.json
          cp "$BUILD_ROOT/openwrt/files/etc/pon-status-layout.json" PON-STATUS-LAYOUT.json
          cp "$BUILD_ROOT/openwrt/files/etc/an7581-driver-fixes.json" AN7581-DRIVER-FIXES-SOURCE.json
          [ ! -f "$BUILD_ROOT/openwrt/files/etc/pon-build-source.json" ] || cp "$BUILD_ROOT/openwrt/files/etc/pon-build-source.json" PON-SOURCE.json
          cp "$GITHUB_WORKSPACE/CPU-USAGE-SOURCE.json" CPU-USAGE-SOURCE.json
          cp "$GITHUB_WORKSPACE/PLUGIN-COMPATIBILITY-VALIDATION.json" PLUGIN-COMPATIBILITY-VALIDATION.json
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v5
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.NPU_VARIANT }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # =========================================================
      # 22. 生成 Release 说明
      # =========================================================
      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          # 没产出固件就别发空 Release
          if [ -z "$FIRMWARE" ] || [ -z "$(ls -A "$FIRMWARE" 2>/dev/null)" ]; then
            echo "::warning::固件目录为空，跳过 Release"
            exit 0
          fi

          # 固定 tag：机型 + 分支，不含时间戳、不含作者
          # 同一机型/分支再次编译时，softprops/action-gh-release 会更新
          # 这个已存在的 Release（同名固件自动覆盖），不会新建版本。
          RELEASE_TAG=$(echo "${DEVICE_NAME}-${REPO_BRANCH}-${NPU_VARIANT}-1456-ppe-${GITHUB_SHA:0:8}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          touch release.txt
          {
            echo "## PonWrt 自动编译固件"
            echo ""
            echo "### 编译信息"
            echo "| 项目 | 详情 |"
            echo "|------|------|"
            echo "| 机型 | \`${PROFILE}\` |"
            echo "| SoC | \`${SOC}\` |"
            echo "| 作者 | \`${FW_AUTHOR}\` |"
            echo "| 源码 | ${REPO_URL} |"
            echo "| 分支 | \`${REPO_BRANCH}\` |"
            echo "| 构建分支 | \`${GITHUB_REF_NAME}\` |"
            echo "| 构建仓库提交 | \`${GITHUB_SHA}\` |"
            echo "| 提交 | \`$(cd "$BUILD_ROOT"/openwrt && git rev-parse --short HEAD)\` |"
            echo "| 编译时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |"
            echo ""
            echo "### 固件文件校验"
            echo '```'
            (cd "$FIRMWARE" && sha256sum * 2>/dev/null | grep -vE "sha256sums|packages")
            echo '```'
            echo ""
            echo "---"
            echo "NPU LuCI 版本：${NPU_VARIANT}；独立来源见 AIROHA-SOURCE.json；MWAN4 与中文界面；PPE v2 NPU stats 拒绝回退；仓库原生 CPU0–CPU3 使用率；RPS 单实例与误报修复；WOL 中文网络唤醒；Argon 中文壁纸配置与 Bing 每日登录壁纸；概览卡片独立加载；默认 LAN 192.168.10.1；MWAN4 停止状态修复；PON 卡片铺满并显示 PON；500–1400MHz 动态兼容超频（旧 BL31 内核 PLL 重实现，未做硬件稳定性验证）。"
            echo "PPE 新增 932 SRAM flush 错误传递及 933 TC 模板时间戳候选；继续使用 1456-62 配对固件，SHA 和驱动对象核对见 PPE-BUILD-VERIFICATION.json。"
            echo "本轮移植 VLAN-aware bridge cache-miss 补充绑定、native L2B key 保护、硬件 flowtable 门控与解绑清理，保留原网口/PHY/DHCP/设备树及 NPU 1456。编译对象与实际函数验证见 NAOKI-OFFLOAD-VERIFICATION.json；BND 数量不代表卸载流量率。"
            echo "naoki LuCI 纳入逐核占用率历史和 aui.legend 缺失回退；不更新无关 ONU/PON 业务配置。此构建尚未完成实机稳定性验证，不能据此宣称已修复另一固件的未知 10G 失联原因。"
            echo "PON fullwidth-v2：独立布局、正常字号、Aurora/Argon 桌面和手机实样式验证；新模块 15_xg2010g_pon，布局版本和文件 SHA 见 PON-STATUS-LAYOUT.json。"
            echo "包含上游 059895c 有用修复：SRAM 失败传递对齐上游；QDMA 重试、BQL、分片 DMA、MTU 与 MIB 修复复用已有等效实现，防止重复。看门狗及 RX31 修复由 6.18.55 原生提供。来源及实际源码检查见 UPSTREAM-059895-*.json。"
            echo "MWAN4 版本见 MWAN4-SOURCE.json：刷机后首次启动默认停止并关闭自启动；页面启动/停止同步开机状态；停用时编辑应用保持停止，刷新仅读取状态。双 WAN 默认预设延后至手动启动时应用。"
            echo "兼容性审查修复：naoki ONU 配套 firewall4 zone-device 卸载补丁与原 FullCone 共存；共享 cpufreq 保留原 ondemand 参数。"
            echo "> 此预发布固件完成构建和离线函数检查后提供下载；设备重拨、ACK 故障恢复、SID 隔离及超频稳定性尚未验收。"
            echo "> 安装前请用 AN758x-Stock2UBI 备份原厂 flash，刷机后恢复 PON/校准数据。"
          } >> release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          make_latest: false
          prerelease: true
          # 不同机型产物后缀不同，缺哪种都别让这一步失败
          fail_on_unmatched_files: false
          files: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.ubi
            ${{ env.FIRMWARE }}/*.img
            ${{ env.FIRMWARE }}/*.img.gz
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.fit
            ${{ env.FIRMWARE }}/*.trx
            ${{ env.FIRMWARE }}/*.tar.gz
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/*.json
